<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCF Liège</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --rcf:#E2001A; --rcf-dark:#B30015;
  --bg:#FFFFFF; --surface:#F8F9FA; --line:#E5E7EB;
  --ink:#111827; --muted:#6B7280; --faint:#9CA3AF;
  /* Deux rôles, pas un. Brandon Grotesque ne sert qu'à la TITRAILLE, en bold
     et en capitales — c'est l'usage défini par la charte RCF. Tout le reste,
     y compris les noms d'émissions et les titres d'épisodes, est du texte
     courant et revient à Open Sans. Si la police n'est pas embarquée, la
     titraille retombe sur Outfit sans que rien d'autre ne bouge. */
  /* La gouttière. Une seule valeur, dont tout dépend : titres de section,
     noms de catégorie, tuiles, panneaux. Tant qu'ils s'y réfèrent tous, rien
     ne peut se désaligner. */
  --g:20px;
  --ft:'Brandon Grotesque','Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fd:var(--fb);
}
/* Titraille : bold, capitales, un peu d'interlettrage — Brandon Grotesque
   n'est pas dessinée pour de longues chaînes en bas de casse. */
.titraille{
  font-family:var(--ft);font-weight:700;
  text-transform:uppercase;letter-spacing:.055em;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--fb);font-size:13px;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.fd{font-family:var(--fd)}
 /* Les carrousels gardent une barre de défilement, mais fine et discrète :
    masquée, rien n'indiquait qu'il y avait quelque chose à droite. Sur mobile
    elle n'apparaît pas de toute façon. */
.defile{-ms-overflow-style:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.defile::-webkit-scrollbar{height:6px}
.defile::-webkit-scrollbar-track{background:transparent}
.defile::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
.defile::-webkit-scrollbar-thumb:hover{background:var(--faint)}
/* Et le bord droit s'efface, pour dire qu'il y a une suite. */
.rail,.pods{
  -webkit-mask-image:linear-gradient(to right,#000 92%,transparent 100%);
  mask-image:linear-gradient(to right,#000 92%,transparent 100%);
}

/* ═══ 1. EN-TÊTE ══════════════════════════════════════════ */
.head{
  background:var(--rcf);color:#fff;
  display:flex;flex-direction:column;align-items:center;
  padding:26px 22px 42px;
  border-radius:0 0 38px 38px;
  box-shadow:0 10px 26px rgba(226,0,26,.20);
  position:relative;z-index:2;
}
.head-main{display:flex;flex-direction:column;align-items:center;width:100%}

/* Sélecteur de stations */
.stations{
  display:flex;gap:4px;width:100%;max-width:330px;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.11);
  padding:4px;border-radius:999px;margin-bottom:18px;
}
.st{
  flex:1;min-width:0;padding:6px 4px;border-radius:999px;text-align:center;white-space:nowrap;
  font-family:var(--ft);font-weight:700;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.72);
  transition:background .25s,color .25s,box-shadow .25s;
}
.st:hover{color:#fff;background:rgba(255,255,255,.11)}
.st.on{background:#fff;color:var(--rcf);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.st.todo{opacity:.62}
.st-hint{
  font-size:10.5px;font-weight:600;color:rgba(255,255,255,.92);
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.12);
  padding:5px 11px;border-radius:9px;margin:-8px 0 14px;
  animation:drop .2s ease-out both;
}

/* Le logo est détouré : blanc sur le rouge, sans cadre ni tuile. */
/* Le logo respire : une marge généreuse tout autour, il ne touche rien. */
.logo{
  width:152px;flex:0 0 auto;margin:10px 0 28px;padding:0 10px;
  display:flex;align-items:center;justify-content:center;
}
.logo img,.logo svg{width:100%;height:auto;display:block}
.logo svg{fill:#fff}
.logo .fallback{font-family:var(--fd);font-weight:900;font-size:34px;letter-spacing:-.03em}

/* La bannière de l'émission en cours, au format des visuels RCF. */
.banner{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
  background:rgba(0,0,0,.16);flex:0 0 auto;margin-bottom:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.20);
}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .fallback{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--fd);font-weight:800;font-size:15px;color:rgba(255,255,255,.55);
  text-align:center;padding:12px;
}
.banner.vide{display:none}
.head-right{flex:1;min-width:0;width:100%;display:flex;flex-direction:column;align-items:center}

.pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.20);border:1px solid rgba(255,255,255,.14);
  padding:5px 11px;border-radius:999px;margin-bottom:14px;
}
.pill-label{
  font-family:var(--ft);font-weight:700;font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;
}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.on .dot{background:#fff;animation:blink 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.eq{display:flex;align-items:flex-end;gap:2.5px;height:13px;
  padding-left:8px;margin-left:1px;border-left:1px solid rgba(255,255,255,.22)}
.eq i{width:2.5px;border-radius:2px;background:rgba(255,255,255,.5);height:40%}
.on .eq i{background:#fff;height:100%;transform-origin:bottom;animation:eq .9s ease-in-out infinite}
.on .eq i:nth-child(2){animation-delay:.18s}
.on .eq i:nth-child(3){animation-delay:.32s}
.on .eq i:nth-child(4){animation-delay:.08s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

.h-title{
  font-family:var(--fd);font-weight:800;font-size:19px;line-height:1.16;
  letter-spacing:-.02em;text-align:center;margin:0 0 4px;
  text-shadow:0 1px 2px rgba(0,0,0,.10);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.h-sub{
  font-weight:600;font-size:12.5px;color:rgba(255,255,255,.78);
  text-align:center;margin:0 0 20px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.big-play{
  width:64px;height:64px;border-radius:50%;background:#fff;color:var(--rcf);
  display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 8px 22px rgba(0,0,0,.20);
  transition:transform .18s cubic-bezier(.34,1.3,.64,1);
}
.big-play:hover{transform:scale(1.07)}
.big-play:active{transform:scale(.94)}
.big-play svg{display:block}

/* ═══ 2. TITRES DE SECTION ════════════════════════════════ */
.sec-head{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:0 var(--g);margin:26px 0 14px;
}
.sec-head h2{
  font-family:var(--ft);font-weight:700;font-size:16px;
  text-transform:uppercase;letter-spacing:.05em;margin:0;
}
.sec-tag{
  font-family:var(--ft);font-weight:700;font-size:10px;
  letter-spacing:.10em;text-transform:uppercase;color:var(--faint);
}
.sec-tag.red{color:var(--rcf)}
.rule{height:1px;background:var(--line);margin:26px var(--g) 0}

/* ═══ 3. CARROUSEL PROGRAMME ══════════════════════════════ */
.rail{
  display:flex;gap:13px;overflow-x:auto;
  padding:4px var(--g) 8px;
  /* scroll-snap aligne sur le bord du conteneur de défilement, pas sur sa boîte
     de remplissage : sans scroll-padding, le navigateur fait défiler de la
     valeur du padding dès le chargement et la marge gauche disparaît. C'est ce
     qui collait la première tuile au bord de l'écran. */
  scroll-snap-type:x mandatory;scroll-padding-left:var(--g);
}
/* 16:9 — c'est le seul format que RCF produit : tous les visuels sont servis
   en 304 × 171. Un cadre carré en recadrait près de la moitié. */
.card{
  flex:0 0 auto;width:156px;scroll-snap-align:center;
  display:flex;flex-direction:column;
  transition:opacity .3s,filter .3s;
}
.card.past{opacity:.4;filter:grayscale(1)}
.card.past:hover{opacity:.92;filter:grayscale(0)}
.card-img{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:13px;overflow:hidden;
  background:linear-gradient(140deg,var(--rcf),var(--rcf-dark));
  display:grid;place-items:center;margin-bottom:9px;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}
.card.now .card-img{
  box-shadow:0 0 0 3px var(--rcf),0 5px 22px rgba(226,0,26,.30);
}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-img .fallback{
  font-family:var(--fd);font-weight:900;font-size:22px;color:rgba(255,255,255,.60);
  letter-spacing:-.03em;
}
.tag{
  position:absolute;left:7px;bottom:7px;
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--ft);font-weight:700;font-size:9px;
  letter-spacing:.08em;text-transform:uppercase;
  padding:3px 6px;border-radius:5px;
  box-shadow:0 2px 6px rgba(0,0,0,.22);
}
.tag.direct{background:var(--rcf);color:#fff}
.tag.direct .d{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 2s infinite}
/* En haut : sinon elle heurte le bouton de lecture dans 128 px. */
.tag.antenne{background:#fff;color:var(--rcf);top:7px;bottom:auto}
.tag.antenne .d{width:5px;height:5px;border-radius:50%;background:var(--rcf);animation:blink 2s infinite}
.card-note{
  font-size:10px;color:var(--faint);margin-top:3px;font-style:italic;
}
.card-play{
  position:absolute;right:7px;bottom:7px;
  width:30px;height:30px;border-radius:50%;background:#fff;color:var(--rcf);
  display:grid;place-items:center;box-shadow:0 2px 9px rgba(0,0,0,.26);
  transition:transform .16s;
}
.card-play:hover{transform:scale(1.13)}
.card-play.on{background:var(--ink);color:#fff}
.card-t{
  font-family:var(--fd);font-weight:700;font-size:11px;color:var(--rcf);
  margin-bottom:2px;font-variant-numeric:tabular-nums;
}
.card.past .card-t{color:var(--muted)}
.card-name{
  font-family:var(--fd);font-weight:700;font-size:12.5px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;margin-bottom:2px;
}
.card-ep{
  font-size:11px;color:var(--muted);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}

/* ═══ 4. CARROUSEL PODCASTS ═══════════════════════════════ */
/* Chaque ligne porte la couleur de sa catégorie dans --c (la teinte de la
   charte, pour les aplats et les traits) et --cd (la même assombrie jusqu'à
   4,5:1 sur blanc, pour tout ce qui porte du texte). Les deux sont posées en
   style= sur .cat ; le rouge reste la couleur de la station, jamais d'une
   rubrique. Défaut : rouge, si une catégorie arrivait sans couleur. */
.cat{--c:var(--rcf);--cd:var(--rcf);position:relative;margin-bottom:6px}
.cat-h{
  position:relative;display:flex;align-items:center;padding:0 var(--g);margin:0 0 11px;
}
.cat-bar{
}
.cat-h b{
  font-family:var(--ft);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--ink);
}
.cat-h i{
  font-style:normal;font-size:10.5px;color:var(--faint);font-weight:600;
}
/* La bande. Un aplat très descendu de la couleur, qui contient le titre, le
   carrousel et le panneau d'épisodes et grandit avec eux. Pleine largeur et
   sans arrondi : un arrondi collé au bord de la fente donne des coins tronqués.
   Le repère de couleur est une petite barre juste avant le nom de la rubrique.
   Elle est posée en absolu et déborde dans la gouttière plutôt que d'être dans
   le flux : si elle poussait le titre, celui-ci ne s'alignerait plus sur
   « À réécouter » ni sur les tuiles. La barre pend donc dans la marge, le titre
   reste sur la gouttière, et les deux sont là où on les attend.
   L'aplat est tiré de --cd et non de --c : les teintes de charte n'ont pas la
   même clarté, et à 7,5 % sur blanc le rose disparaissait quand le rouge se
   voyait bien. Les variantes assombries sont toutes à ~4,5:1, donc leurs voiles
   pèsent le même poids. L'opacité passe par un calque plutôt que par
   color-mix : plus portable. */
.cat{padding:15px 0 4px;margin-bottom:6px}
.cat::before{
  content:'';position:absolute;inset:0;background:var(--cd);opacity:.075;
  pointer-events:none;
}
.cat-bar{
  position:absolute;left:calc(var(--g) - 14px);top:50%;transform:translateY(-50%);
  width:4px;height:16px;border-radius:4px;background:var(--c);
}

/* ?sans-bandes=1 retire l'aplat, pour comparer. */
[data-bandes="0"] .cat{padding:0;margin-bottom:14px}
[data-bandes="0"] .cat::before{content:none}
.pod-wrap{position:relative}
.pods{
  display:flex;gap:16px;overflow-x:auto;padding:5px var(--g) 14px;
  scroll-snap-type:x mandatory;scroll-padding-left:var(--g);
}
.pod{flex:0 0 auto;width:156px;scroll-snap-align:start;cursor:pointer}
.pod-img{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:13px;overflow:hidden;
  background:linear-gradient(140deg,var(--c),var(--cd));
  display:grid;place-items:center;padding:10px;
  box-shadow:0 2px 9px rgba(0,0,0,.11);
  transition:box-shadow .25s,transform .25s;
}
.pod:hover .pod-img{box-shadow:0 5px 18px rgba(0,0,0,.17);transform:translateY(-2px)}
.pod.active .pod-img{box-shadow:0 0 0 3px var(--c),0 5px 18px rgba(0,0,0,.20)}
.pod-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Pas de titre incrusté : les visuels RCF portent déjà le nom de l'émission.
   Le titre n'apparaît qu'en secours, quand l'image ne se charge pas. */
.pod-name{
  font-family:var(--fd);font-weight:700;font-size:12px;line-height:1.2;color:#fff;
  text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.35);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.pod-meta{
  font-size:11px;color:var(--muted);margin-top:8px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ═══ 5. PANNEAU DES ÉPISODES ═════════════════════════════ */
.eps{
  /* 374 = en-tête (38) + cinq lignes pleines (61) + une moitié : la ligne
     coupée dit qu'il y en a d'autres, sans donner l'impression d'un bug. */
  margin:4px var(--g) 8px;max-height:374px;overflow-y:auto;border-radius:14px;overflow:hidden;
  /* Pas de cadre : le panneau est posé en blanc sur l'aplat de la ligne, qui
     fait déjà office de contenant. C'est le fond clair qui le détache. */
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.07);
  animation:drop .22s ease-out both;
}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.eps-h{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--line);
}
.eps-h span:first-child{
  font-family:var(--ft);font-weight:700;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.eps-h b{
  font-family:var(--fd);font-weight:700;font-size:11.5px;color:var(--cd);
  max-width:56%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ep{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:12px 16px;border-bottom:1px solid rgba(229,231,235,.9);
  transition:background .15s;
}
.ep:last-child{border-bottom:0}
.ep:hover{background:var(--surface)}
.ep-btn{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  /* Icône grise sur gris clair au repos : une flèche blanche sur ce fond ne se
     voyait pas. Elle passe en blanc une fois le bouton coloré. */
  background:#F1F2F4;color:var(--muted);display:grid;place-items:center;
  transition:background .2s,color .2s,transform .2s;
}
.ep.on .ep-btn,.ep:hover .ep-btn{background:var(--cd);color:#fff;transform:scale(1.05)}
.ep.on{background:var(--surface)}
.ep-txt{flex:1;min-width:0}
.ep-t{
  font-weight:700;font-size:13px;color:#1F2937;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;
}
.ep-m{font-size:11px;color:var(--faint);margin-top:3px}
.nouveau{
  font-family:var(--ft);font-weight:700;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--cd);color:#fff;
  padding:3px 6px;border-radius:6px;flex:0 0 auto;
}

/* ═══ 7. VARIANTE LARGE — widgets:["IF"] ══════════════════ */
@media (min-width:620px){
  /* Le contenu de l'en-tête est ramené au milieu : au-delà de 880 px, le
     remplissage latéral absorbe tout le surplus, donc le groupe logo + émission
     + lecture reste centré au lieu de s'étaler jusqu'aux bords de la fente.
     Ça se fait par le remplissage, sans conteneur supplémentaire. */
  .head{
    padding:30px max(34px, calc((100% - 880px) / 2)) 46px;
    border-radius:0 0 34px 34px;align-items:stretch;
  }
  .head-main{flex-direction:row;align-items:center;gap:30px}
  .stations{width:auto;max-width:none;margin:0 0 16px auto}
  .st{flex:0 0 auto;padding:6px 16px;font-size:11.5px}
  .st-hint{margin:-10px 0 16px auto;align-self:flex-end}
  .logo{margin:0;width:186px;padding:0 8px 0 0}
  .head-right{flex-direction:row;align-items:center;gap:26px}
  .banner{width:238px;margin-bottom:0}
  .head-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .pill{margin-bottom:12px}
  .h-title{text-align:left;font-size:27px;margin-bottom:5px}
  .h-sub{text-align:left;margin-bottom:0;font-size:13.5px}
  .big-play{width:76px;height:76px}
  :root{--g:26px}
  .pod{width:200px}
  .card{width:200px}
  .sec-head{margin-top:20px}
}
</style>
</head>
<body>

<!-- 1. EN-TÊTE -->
<div class="head" id="head">
  <div class="stations" id="stations" role="tablist"></div>
  <div class="st-hint" id="stHint" hidden></div>
  <div class="head-main">
    <div class="logo" id="logo"></div>
    <div class="head-right">
      <div class="banner" id="banner"></div>
      <div class="head-mid">
        <div class="pill">
          <span class="dot"></span>
          <span class="pill-label" id="pillLabel">En direct</span>
          <span class="eq"><i></i><i></i><i></i><i></i></span>
        </div>
        <h1 class="h-title" id="hTitle">RCF Liège</h1>
        <p class="h-sub" id="hSub"></p>
      </div>
    </div>
    <button class="big-play" id="bigPlay" aria-label="Écouter le direct"></button>
  </div>
</div>

<!-- 2. PROGRAMME -->
<div class="sec-head">
  <h2 class="fd">Programme</h2>
  <span class="sec-tag red" id="secDay">Aujourd'hui</span>
</div>
<div class="rail defile" id="rail"></div>

<div class="rule"></div>

<!-- 3. À RÉÉCOUTER -->
<div class="sec-head">
  <h2 class="fd">À réécouter</h2>
  <span class="sec-tag">Podcasts</span>

<script>
(function(){
"use strict";

var D = JSON.parse(document.getElementById('rcf-data').textContent);
// Deux logos : celui de RCF Liège (image détourée, blanc sur transparent) et le
// lettrage RCF générique en vectoriel, qui sert aux stations sans logo propre.
var LOGO = (document.getElementById('rcf-logo').textContent || '').trim();
var LOGO_SVG = (document.getElementById('rcf-logo-generique').textContent || '').trim();
var K = D.gridKeys, P = D.prefixes, RPID = D.station.rpId;

/* ─── utilitaires ─────────────────────────────────────── */
function expand(s){ if(!s) return ''; var i=s.indexOf('|'); return i<0?s:(P[s.slice(0,i)]||'')+s.slice(i+1); }
// 304x171 est le seul gabarit qu'assets.radiorcf.com serve réellement (vérifié
// le 15/09/2026 : 640x360, 1000x1000, large, original renvoient tous une erreur ;
// « medium » passe mais ne fait que 220x124).
function img(s){ return expand(s).replace('{style_name}','304x171'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function mins(ms){ if(!ms) return ''; var s=Math.round(ms/1000);
  return s<60 ? s+' s' : Math.round(s/60)+' min'; }
function mono(t){
  t=(t||'?').trim();
  var w=t.split(/[\s'’•·]+/).filter(function(x){return /[A-Za-zÀ-ÿ0-9]/.test(x)});
  if(!w.length) return '?';
  return (w[0][0]+(w[1]?w[1][0]:'')).toUpperCase();
}
// L'image est posée PAR-DESSUS le monogramme : si elle échoue, elle s'efface.
function visual(src, title){
  var u = img(src);
  var f = '<span class="fallback">'+esc(mono(title))+'</span>';
  return u ? f+'<img src="'+esc(u)+'" alt="" loading="lazy" onerror="this.remove()">' : f;
}
// Variante des podcasts : en secours c'est le titre entier qui s'affiche,
// pas un monogramme — puisque plus rien n'est écrit par-dessus la vignette.
function visualTitre(src, title){
  var u = img(src);
  var f = '<span class="pod-name">'+esc(title)+'</span>';
  return u ? f+'<img src="'+esc(u)+'" alt="'+esc(title)+'" loading="lazy" onerror="this.remove()">' : f;
}
function toMin(t){ var p=(t||'0:0').split(':'); return (+p[0])*60+(+p[1]); }
function fmtDay(d){
  if(!d) return '';
  var M=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var p=d.split('-'); return (+p[2])+' '+M[(+p[1])-1];
}
function el(id){ return document.getElementById(id); }

/* ─── grille ──────────────────────────────────────────── */
// Deux sources, même forme d'objet en sortie : {t,show,ep,audio,dur,img,type,pres,id}.
// zipStatique lit le tableau compact injecté au build (fenêtre de secours,
// affichée le temps que le direct réponde). mapApi lit la réponse réelle de
// rcf.be/wp-json/rcf/v1/programs (forme observée le 16/09/2026, fiche 23/25).
function zipStatique(a){ var o={}; K.forEach(function(k,i){o[k]=a[i]});
  o.show=(o.show||'').trim(); o.ep=(o.ep||'').trim(); return o; }
function mapApi(it){
  return {
    t:    it.start_time || '',
    show: (it.show_title || '').trim(),
    ep:   (it.episode_title || '').trim(),
    audio: it.episode_audio || '',
    dur:  Number(it.duration) || 0,
    img:  it.img_episode || it.img_show || '',
    type: it.type || '',
    pres: it.presenter || '',
    id:   it.episode_id || ''
  };
}
// jours : [{offset:-1..2, objs:[...]}], un jour = un décalage entier de 1440 min
// par rapport à aujourd'hui. Remplace le rattrapage « +1440 si l'heure recule »
// qui ne savait gérer qu'une seule journée : ici chaque case porte déjà son jour.
function construireRows(jours){
  var rows = [];
  jours.forEach(function(j){
    j.objs.forEach(function(o){
      var r = {}; for(var k in o) r[k]=o[k];
      r.abs = j.offset*1440 + toMin(r.t);
      r.jourOffset = j.offset;
      r.state = r.type==='live' ? 'direct' : (r.audio ? 'ecoutable' : 'sans');
      rows.push(r);
    });
  });
  var d = new Date();
  var nowAbs = d.getHours()*60 + d.getMinutes();
  var curIdx = 0;
  for(var i=0;i<rows.length;i++){ if(rows[i].abs<=nowAbs) curIdx=i; }

  /* Le programme ne montre pas une seule journée mais une fenêtre glissante
     autour de l'émission en cours : un jour avant, deux jours après. Quelques
     cases derrière pour le rattrapage, davantage devant pour ce qui arrive. La
     fenêtre garde une taille constante et se cale contre les extrémités — à
     23 h 30 on ne se retrouve donc pas avec une seule case à l'écran. */
  var AVANT = 4, APRES = 13, LARGEUR = AVANT + 1 + APRES;
  var debutFen = Math.max(0, Math.min(curIdx - AVANT, rows.length - LARGEUR));
  var finFen   = Math.min(rows.length, debutFen + LARGEUR);
  return { rows: rows.slice(debutFen, finFen), curIdx: curIdx - debutFen };
}
// Premier affichage instantané à partir de la donnée figée au build (un seul
// jour) : rien à attendre pour peindre l'écran. chargerProgramme() la remplace
// dès que le direct a répondu, plus bas.
var initial = construireRows([{ offset: 0, objs: D.grid.map(zipStatique) }]);
var rows = initial.rows, curIdx = initial.curIdx;

/* ─── tri des podcasts ────────────────────────────────── */
// Du plus récent au plus ancien : la date de diffusion d'abord ; à date égale,
// l'identifiant d'épisode, qui croît avec la publication — le dernier publié
// d'une même journée passe donc devant. C'est ce qui départage les rendez-vous
// quotidiens comme Le flash belge, qui produisent plusieurs épisodes par jour.
function plusRecent(a, b){
  if(a.day !== b.day) return a.day < b.day ? 1 : -1;
  return (+b.id || 0) - (+a.id || 0);
}
(D.series || []).forEach(function(s){ s.eps.sort(plusRecent); });
D.series = (D.series || []).slice().sort(function(x, y){
  var a = x.eps[0], b = y.eps[0];
  if(!a || !b) return a ? -1 : (b ? 1 : 0);
  return plusRecent(a, b);
});

/* ─── état ────────────────────────────────────────────── */
var playingLive=false, playingEp=null;

/* ─── dialogue avec la console Radioplayer ────────────── */
// Le son appartient au player Radioplayer. Aucune balise <audio> ici.
function send(type, extra){
  var m = {type:type}; if(extra) for(var k in extra) m[k]=extra[k];
  try{ parent.postMessage(m,'*'); }catch(e){}
}
function log(label, payload){
  try{ parent.postMessage({type:'__DebugLog', label:label, payload:payload}, '*'); }catch(e){}
}
// Les types sont des chaînes en minuscules — « play », « requestplay » — et non
// les noms d'interfaces de la documentation (PlayMessage, RequestPlayMessage).
// Vérifié dans le guide d'intégration, section « Using iframe messaging ».
window.addEventListener('message', function(e){
  var m=e.data; if(!m||typeof m!=='object'||!m.type) return;
  switch(m.type){
    case 'play':  playingLive=true;  paintHead(); break;
    case 'pause': playingLive=false; playingEp=null; paintHead(); paintRail(); repaintEps(); break;
    case 'time':
      // payload : PlaybackStatus { paused, live, time, volume, … }
      if(m.payload && typeof m.payload.paused === 'boolean' && m.payload.paused === playingLive){
        playingLive = !m.payload.paused; paintHead();
      }
      break;
    case 'nowplaying':
      // payload.now : SongEvent | ProgrammeEvent | StationEvent
      var n = m.payload && m.payload.now; if(!n) break;
      var texte = n.name
        ? n.name + (n.artistName ? ' — ' + n.artistName : '')
        : (n.programmeName || n.serviceName || '');
      if(texte) el('hSub').textContent = texte;
      break;
  }
});

/* ─── icônes ──────────────────────────────────────────── */
var PLAY_L ='<svg width="24" height="24" viewBox="0 0 18 18" fill="currentColor" style="margin-left:3px"><path d="M4.4 2.4 15.2 9 4.4 15.6z"/></svg>';
var PAUSE_L='<svg width="22" height="22" viewBox="0 0 18 18" fill="currentColor"><rect x="3.2" y="2.2" width="4.2" height="13.6" rx="1.5"/><rect x="10.6" y="2.2" width="4.2" height="13.6" rx="1.5"/></svg>';
var PLAY_M ='<svg width="13" height="13" viewBox="0 0 18 18" fill="currentColor" style="margin-left:2px"><path d="M4.4 2.4 15.2 9 4.4 15.6z"/></svg>';
var PAUSE_M='<svg width="12" height="12" viewBox="0 0 18 18" fill="currentColor"><rect x="3.2" y="2.2" width="4.2" height="13.6" rx="1.5"/><rect x="10.6" y="2.2" width="4.2" height="13.6" rx="1.5"/></svg>';
var PLAY_S ='<svg width="12" height="12" viewBox="0 0 18 18" fill="#fff" style="margin-left:2px"><path d="M4.4 2.4 15.2 9 4.4 15.6z"/></svg>';
var PAUSE_S='<svg width="12" height="12" viewBox="0 0 18 18" fill="#fff"><rect x="3.2" y="2.2" width="4.2" height="13.6" rx="1.5"/><rect x="10.6" y="2.2" width="4.2" height="13.6" rx="1.5"/></svg>';

/* ─── en-tête ─────────────────────────────────────────── */
function paintLogo(){
  var active = (D.stations||[]).filter(function(s){ return s.actuelle; })[0];
  // Seule RCF Liège a son logo propre ici ; les autres reçoivent le lettrage
  // RCF générique, en vectoriel, qui reste juste à toutes les tailles.
  el('logo').innerHTML = (active && active.id === 'liege' && LOGO)
    ? '<img src="'+LOGO+'" alt="'+esc(active.nom)+'">'
    : (LOGO_SVG || '<span class="fallback">RCF</span>');
}

/* ─── sélecteur de stations ───────────────────────────── */
// Radioplayer change de station en chargeant la console de l'autre station.
// On fait pareil : c'est la seule voie qui garde le logo, le nom, le titre en
// cours et les statistiques d'écoute alignés sur ce qui sort des haut-parleurs.
function paintStations(){
  el('stations').innerHTML = (D.stations||[]).map(function(s, i){
    return '<button class="st'+(s.actuelle?' on':'')+((!s.actuelle && !s.console)?' todo':'')+'" '+
           'data-st="'+i+'" role="tab" aria-selected="'+(!!s.actuelle)+'">'+esc(s.court)+'</button>';
  }).join('');
}
var hintTimer = null;
function hint(msg){
  var h = el('stHint');
  h.textContent = msg; h.hidden = false;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ h.hidden = true; }, 3200);
}
function switchStation(s){
  if(s.actuelle) return;
  if(!s.console){
    hint(s.alerte || ('Console ' + s.nom + ' — URL à renseigner'));
    log('→ changement de station impossible', {station:s.nom, raison:s.alerte||'console inconnue'});
    return;
  }
  log('→ changement de station', {station:s.nom, rpId:s.rpId, url:s.console});
  send('__RequestStationChange', {station:s.code, rpId:s.rpId, url:s.console});
  // Navigation de la fenêtre du dessus : autorisée depuis une iframe tierce
  // tant qu'elle découle d'un clic et que l'iframe n'est pas en sandbox.
  try{ top.location.href = s.console; }catch(e){ log('→ navigation refusée', {erreur:String(e)}); }
}

function paintHead(){
  var r = rows[curIdx];
  // La bannière de l'émission en cours, au même format 16:9 que tout le reste.
  var u = img(r.img);
  var b = el('banner');
  b.classList.toggle('vide', !u && !(r.show || r.ep));
  b.innerHTML = u
    ? '<span class="fallback">'+esc(r.show || r.ep)+'</span>'+
      '<img src="'+esc(u)+'" alt="" onerror="this.remove()">'
    : '<span class="fallback">'+esc(r.show || r.ep || D.station.nom)+'</span>';
  el('hTitle').textContent = r.show || r.ep || D.station.nom;
  el('hSub').textContent   = (r.ep && r.ep !== r.show) ? r.ep : (r.pres || D.station.nom);
  el('pillLabel').textContent = 'En direct · ' + r.t;
  el('bigPlay').innerHTML = playingLive ? PAUSE_L : PLAY_L;
  el('bigPlay').setAttribute('aria-label', playingLive ? 'Mettre en pause' : 'Écouter le direct');
  el('head').classList.toggle('on', playingLive);
}
el('bigPlay').addEventListener('click', function(){
  if(playingLive){ send('requestpause'); }
  else { send('requestskiptolive'); send('requestplay'); }
});

/* ─── carrousel programme ─────────────────────────────── */
function paintRail(){
  el('rail').innerHTML = rows.map(function(r, i){
    var cls = 'card' + (i<curIdx?' past':'') + (i===curIdx?' now':'');
    var over = '';
    if(r.state === 'direct'){
      over = '<span class="tag direct"><span class="d"></span>Direct</span>';
    } else if(r.state === 'ecoutable'){
      var on = playingEp === r.id;
      over = '<button class="card-play'+(on?' on':'')+'" data-ep="'+esc(r.id)+'" '+
             'aria-label="Réécouter">'+(on?PAUSE_M:PLAY_M)+'</button>';
    }
    // L'absence de podcast ne mérite pas une pastille sur l'image : elle se lit
    // à l'absence de bouton, et se dit en clair sous le titre.
    // Le créneau en cours porte un repère lisible quelle que soit la vignette —
    // l'anneau rouge disparaît sur une image rouge.
    if(i === curIdx && r.state !== 'direct'){
      over = '<span class="tag antenne"><span class="d"></span>À l’antenne</span>' + over;
    }
    var sub = (r.ep && r.ep !== r.show) ? r.ep : (r.pres || '');
    var note = r.state === 'sans' ? '<div class="card-note">pas de podcast</div>' : '';
    return '<div class="'+cls+'" id="c'+i+'">'+
      '<div class="card-img">'+visual(r.img, r.show||r.ep)+over+'</div>'+
      '<div class="card-t">'+esc(r.t)+(r.dur?' · '+esc(mins(r.dur)):'')+'</div>'+
      '<div class="card-name">'+esc(r.show||r.ep||'—')+'</div>'+
      (sub?'<div class="card-ep">'+esc(sub)+'</div>':'')+
      note+
    '</div>';
  }).join('');
}

/* ─── carrousels de podcasts, une ligne par catégorie ─── */
// Chaque catégorie a sa propre ligne et son propre panneau d'épisodes : ouvrir
// une émission de « Culture » ne referme pas celle d'« Actualité ».
var ouvert = {};   // slug de catégorie → indice de série ouverte

function paintCats(){
  el('cats').innerHTML = (D.categories || []).map(function(c, ci){
    var tuiles = c.series.map(function(s, si){
      return '<div class="pod'+(ouvert[c.slug] === si ? ' active' : '')+'" '+
             'data-cat="'+ci+'" data-serie="'+si+'">'+
        '<div class="pod-img">'+visualTitre(s.img, s.t)+'</div>'+
        '<div class="pod-meta">'+esc(s.pres || '')+'</div>'+
      '</div>';
    }).join('');
    // La couleur de la catégorie descend par deux variables CSS : tout ce qui
    // est en dessous s'y branche sans connaître la catégorie.
    var style = c.couleur
      ? ' style="--c:'+esc(c.couleur)+';--cd:'+esc(c.couleurTexte || c.couleur)+'"'
      : '';
    return '<div class="cat"'+style+'>'+
      '<div class="cat-h"><span class="cat-bar"></span><b>'+esc(c.nom)+'</b></div>'+
      '<div class="pods defile">'+tuiles+'</div>'+
      '<div id="eps-'+ci+'"></div>'+
    '</div>';
  }).join('');
  (D.categories || []).forEach(function(c, ci){ paintEps(c, ci); });
}

function paintEps(c, ci){
  var host = el('eps-' + ci);
  if(!host) return;
  var si = ouvert[c.slug];
  if(si === undefined || !c.series[si]){ host.innerHTML = ''; return; }
  var s = c.series[si];
  host.innerHTML = '<div class="eps"><div class="eps-h">'+
    '<span>Derniers épisodes</span><b>'+esc(s.t)+'</b></div>'+
    s.eps.map(function(e, i){
      var on = playingEp === e.id;
      return '<button class="ep'+(on?' on':'')+'" data-ep="'+esc(e.id)+'">'+
        '<span class="ep-btn">'+(on?PAUSE_S:PLAY_S)+'</span>'+
        '<span class="ep-txt"><span class="ep-t">'+esc(e.t)+'</span>'+
        '<span class="ep-m">'+esc(fmtDay(e.day))+' · '+esc(mins(e.d))+'</span></span>'+
        (i===0?'<span class="nouveau">Nouveau</span>':'')+
      '</button>';
    }).join('')+'</div>';
}

function repaintEps(){ (D.categories || []).forEach(function(c, ci){ paintEps(c, ci); }); }

/* ─── lecture à la demande ────────────────────────────── */
// Aucun message postMessage ne permet de charger un épisode :
// la console doit être rechargée avec ?rpOdId=…
function playEpisode(id){
  if(playingEp === id){ send('requestpause'); playingEp = null; }
  else {
    playingEp = id; playingLive = false;
    var url = '?rpOdId='+encodeURIComponent(id)+'&rpSt='+RPID+'&rpSrp=index';
    log('→ navigation console', {url:url, episode:id});
    send('__RequestOnDemand', {odId:id, stationId:RPID, url:url});
  }
  paintHead(); paintRail(); repaintEps();
}

/* ─── interactions ────────────────────────────────────── */
document.addEventListener('click', function(ev){
  var s = ev.target.closest('[data-st]');
  if(s){ switchStation(D.stations[+s.getAttribute('data-st')]); return; }
  var b = ev.target.closest('[data-ep]');
  if(b){ ev.preventDefault(); ev.stopPropagation(); playEpisode(b.getAttribute('data-ep')); return; }
  var t = ev.target.closest('[data-serie]');
  if(t){
    var ci = +t.getAttribute('data-cat'), si = +t.getAttribute('data-serie');
    var c = D.categories[ci];
    ouvert[c.slug] = (ouvert[c.slug] === si) ? undefined : si;
    paintCats();
    return;
  }
});
function tab(){}

/* ─── init ────────────────────────────────────────────── */
el('secDay').textContent    = 'Aujourd’hui';

/* Chaque catégorie est une bande : un aplat très descendu de sa couleur, qui
   contient le titre, le carrousel et le panneau d'épisodes. ?sans-bandes=1
   retire l'aplat, pour comparer. */
if(/[?&]sans-bandes=1/.test(location.search)) el('cats').setAttribute('data-bandes','0');

paintLogo(); paintStations(); paintHead(); paintRail(); paintCats();

// Le créneau en cours est amené au centre ; le passé reste accessible à gauche.
requestAnimationFrame(function(){
  var c = el('rail'), it = el('c'+curIdx);
  if(it) c.scrollLeft = it.offsetLeft - c.clientWidth/2 + it.clientWidth/2;
});

send('__IframeReady', {station:D.station.code, rpId:RPID});

/* ─── programme en direct ────────────────────────────── */
// CORS ouvert, vérifié le 16/09/2026 (fiche 23 §1) : rcf.be/wp-json/rcf/v1/programs
// accepte les appels du navigateur, sans serveur intermédiaire. On interroge
// hier, aujourd'hui et les deux jours suivants pour nourrir la fenêtre glissante.
// nowplaying (même route CORS-ouverte) a été vérifié dans la même session mais
// n'est pas branché ici : son couple title/artist ferait doublon avec le hSub
// déjà calculé depuis la grille (r.ep/r.pres) et risquerait de le contredire.
// À reconsidérer si la grille s'avère parfois en retard sur un changement de
// dernière minute.
function dateISO(offset){
  var d = new Date(); d.setDate(d.getDate() + offset);
  var p = function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function chargerProgramme(){
  var offsets = [-1, 0, 1, 2];
  return Promise.all(offsets.map(function(off){
    var url = 'https://rcf.be/wp-json/rcf/v1/programs?station='+encodeURIComponent(D.station.code)+'&date='+dateISO(off);
    return fetch(url)
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return { offset: off, objs: (j && j.items ? j.items : []).map(mapApi) }; })
      .catch(function(){ return { offset: off, objs: [] }; });
  })).then(function(jours){
    jours = jours.filter(function(j){ return j.objs.length; });
    if(!jours.length) return; // API injoignable : on garde la grille figée du build
    var res = construireRows(jours);
    rows = res.rows; curIdx = res.curIdx;
    paintHead(); paintRail();
    requestAnimationFrame(function(){
      var c = el('rail'), it = el('c'+curIdx);
      if(it) c.scrollLeft = it.offsetLeft - c.clientWidth/2 + it.clientWidth/2;
    });
  });
}
chargerProgramme();
setInterval(chargerProgramme, 60000);
})();
</script>
</body>
</html>
